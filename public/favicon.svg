<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="HGIORGIS">
  <defs>
    <linearGradient id="accentPx" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#ffb020"/>
    </linearGradient>
    <linearGradient id="accentPxLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4500"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
  </defs>
  <style>
    .px-bg { fill: #0b0b0d; }
    .px-w { fill: #f4f4f5; }
    .px-a { fill: url(#accentPx); }
    @media (prefers-color-scheme: light) {
      .px-bg { fill: #fff8f4; }
      .px-w { fill: #121214; }
      .px-a { fill: url(#accentPxLight); }
    }
  </style>
  <!-- Pixel "H" like reference: accent TL, stem, 2-block bar, 3-block right stem -->
  <rect class="px-bg" width="32" height="32" rx="6"/>
  <g transform="translate(4,4)">
    <!-- 6×6px tiles, 1px gap → 7px step -->
    <rect class="px-a" x="1" y="-1" width="6" height="6" rx="1"/>
    <rect class="px-w" x="1" y="6" width="6" height="6" rx="1"/>
    <rect class="px-w" x="8" y="13" width="6" height="6" rx="1"/>
    <rect class="px-w" x="16" y="13" width="6" height="6" rx="1"/>
    <rect class="px-w" x="16" y="6" width="6" height="6" rx="1"/>
    <rect class="px-w" x="16" y="20" width="6" height="6" rx="1"/>
  </g>
</svg>
